  /* ---------------- phase 3: result highlighting (pure, no network) ---------------- */

  function parseRange(rangeStr){
    if(!rangeStr) return null;
    var raw = String(rangeStr).trim();
    // Normalize the various dash characters labs use ("\u2012\u2013\u2014\u2212", i.e.
    // figure dash, en dash, em dash, minus sign) to a plain hyphen for two-sided ranges.
    var normalized = raw.replace(/[\u2012\u2013\u2014\u2212]/g, "-");
    var m;
    if((m = normalized.match(/^([\d.]+)\s*-\s*([\d.]+)$/))) return { min: parseFloat(m[1]), max: parseFloat(m[2]) };
    // One-sided limits: <x, <=x, \u2264x (\u2264 = "less than or equal to")
    if((m = raw.match(/^(?:<|\u2264)\s*=?\s*([\d.]+)$/))) return { max: parseFloat(m[1]) };
    // >x, >=x, \u2265x (\u2265 = "greater than or equal to")
    if((m = raw.match(/^(?:>|\u2265)\s*=?\s*([\d.]+)$/))) return { min: parseFloat(m[1]) };
    return null;
  }

  function computeTestStatus(test){
    if(test.labFlag && /critical|panic|crit/i.test(test.labFlag)){
      return { status: "red", reason: "Lab-reported critical flag on this report: \"" + test.labFlag + "\"" };
    }
    if(test.value === null || test.value === undefined || test.value === ""){
      return { status: "grey", reason: "Needs verification \u2014 no value recorded for this test" };
    }
    var val = parseFloat(test.value);
    // Reject values like "G1" or "Negative" that parseFloat would otherwise
    // partially parse (e.g. parseFloat("5mg") = 5) -- only a value that is
    // ENTIRELY numeric is treated as comparable; anything else (categorical
    // results included) is left as Needs verification rather than guessed at.
    if(isNaN(val) || !/^-?[\d.]+$/.test(String(test.value).trim())){
      return { status: "grey", reason: "Needs verification \u2014 value (\"" + test.value + "\") is not a plain number, so it can't be automatically compared to a range" };
    }
    var range = parseRange(test.referenceRange);
    if(!range){
      return { status: "grey", reason: "Needs verification \u2014 reference range (\"" + (test.referenceRange || "not recorded") + "\") could not be reliably parsed" };
    }
    var inRange = true;
    if(range.min !== undefined && val < range.min) inRange = false;
    if(range.max !== undefined && val > range.max) inRange = false;
    if(inRange) return { status: "green", reason: "Within the printed range (" + test.referenceRange + ")" };
    return { status: "yellow", reason: "Outside the printed range (" + test.referenceRange + ")" };
  }

  var MEDICAL_STATUS_COLORS = { green: "#4CAF7D", yellow: "#E8C766", grey: "#8A8496", red: "#E85D75" };
  var MEDICAL_STATUS_LABELS = {
    green: "\ud83d\udfe2 Within reported range",
    yellow: "\ud83d\udfe1 Outside reported range",
    grey: "\u26aa Needs verification",
    red: "\ud83d\udd34 Critical flag"
  };
  var MEDICAL_STATUS_SORT_ORDER = { red: 0, yellow: 1, grey: 2, green: 3 };

  /* ---------------- phase 2: extraction (server call), review, save ---------------- */

  function extractReport(reportId){
    if(!medicalDetailContainer) return;
    medicalDetailContainer.innerHTML = '<p class="empty">Sending this report to Claude via Netlify\u2019s AI Gateway to read it\u2026 this can take up to a minute or so for a long report.</p>';
    var user = window.netlifyIdentity.currentUser();
    user.jwt().then(function(token){
      return fetch(MEDICAL_EXTRACT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ id: reportId })
      });
    }).then(function(res){
      return res.json().then(function(body){ return { res: res, body: body }; });
    }).then(function(r){
      if(!r.res.ok || (r.body && r.body.error)){
        medicalDetailContainer.innerHTML = '<p class="empty">' + escapeHtml((r.body && r.body.error) || "Extraction failed. Try again.") + '</p>';
        return;
      }
      pollExtractionJob(reportId, r.body.jobId, 0);
    }).catch(function(e){
      console.error("extraction failed", e);
      medicalDetailContainer.innerHTML = '<p class="empty">Could not reach the extraction service. Try again.</p>';
    });
  }

  function pollExtractionJob(reportId, jobId, attempt){
    if(attempt > 40){
      medicalDetailContainer.innerHTML = '<p class="empty">This is taking longer than expected. Try again in a moment.</p>';
      return;
    }
    var user = window.netlifyIdentity.currentUser();
    user.jwt().then(function(token){
      return fetch(MEDICAL_EXTRACT_ENDPOINT + "?jobId=" + encodeURIComponent(jobId), { headers: { "Authorization": "Bearer " + token } });
    }).then(function(res){ return res.json(); }).then(function(body){
      if(body.status === "done"){
        renderExtractionReview(reportId, body.tests || []);
      }else if(body.status === "error"){
        medicalDetailContainer.innerHTML = '<p class="empty">' + escapeHtml(body.error || "Extraction failed. Try again.") + '</p>';
      }else{
        medicalDetailContainer.innerHTML = '<p class="empty">Reading your report\u2026</p>';
        setTimeout(function(){ pollExtractionJob(reportId, jobId, attempt + 1); }, 3000);
      }
    }).catch(function(e){
      console.error("poll failed", e);
      setTimeout(function(){ pollExtractionJob(reportId, jobId, attempt + 1); }, 3000);
    });
  }

  function renderExtractionReview(reportId, tests){
    medicalDetailContainer.innerHTML = "";

    var note = document.createElement("p");
    note.className = "hero-loop";
    note.style.marginBottom = "14px";
    note.textContent = "Check each row against the original report (use View above) and correct anything that's wrong before saving. Nothing is kept until you save.";
    medicalDetailContainer.appendChild(note);

    var rowsState = tests.map(function(t){
      return {
        section: t.section || "", name: t.name || "",
        value: (t.value === null || t.value === undefined) ? "" : String(t.value),
        unit: t.unit || "", referenceRange: t.referenceRange || "", labFlag: t.labFlag || ""
      };
    });

    var tableWrap = document.createElement("div");
    tableWrap.className = "fin-table-wrap";
    var table = document.createElement("table");
    table.className = "fin-table";
    table.innerHTML = "<thead><tr><th>Section</th><th>Test</th><th>Value</th><th>Unit</th><th>Reference range</th><th>Lab flag</th><th></th></tr></thead>";
    var tbody = document.createElement("tbody");
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    medicalDetailContainer.appendChild(tableWrap);

    function cellInput(idx, field, value){
      var td = document.createElement("td");
      var inp = document.createElement("input");
      inp.type = "text"; inp.value = value; inp.style.width = "100%";
      inp.addEventListener("input", function(){ rowsState[idx][field] = inp.value; });
      td.appendChild(inp);
      return td;
    }

    function renderRows(){
      tbody.innerHTML = "";
      rowsState.forEach(function(t, idx){
        var tr = document.createElement("tr");
        tr.className = "fin-row";
        tr.appendChild(cellInput(idx, "section", t.section));
        tr.appendChild(cellInput(idx, "name", t.name));
        tr.appendChild(cellInput(idx, "value", t.value));
        tr.appendChild(cellInput(idx, "unit", t.unit));
        tr.appendChild(cellInput(idx, "referenceRange", t.referenceRange));
        tr.appendChild(cellInput(idx, "labFlag", t.labFlag));
        var delTd = document.createElement("td");
        var delBtn = document.createElement("button");
        delBtn.className = "s-remove"; delBtn.textContent = "\u00d7"; delBtn.title = "Remove this row";
        delBtn.addEventListener("click", function(){ rowsState.splice(idx, 1); renderRows(); });
        delTd.appendChild(delBtn);
        tr.appendChild(delTd);
        tbody.appendChild(tr);
      });
    }
    renderRows();

    var btnRow = document.createElement("div");
    btnRow.style.cssText = "display:flex; gap:12px; margin-top:16px;";
    var saveBtn = document.createElement("button");
    saveBtn.className = "log-btn"; saveBtn.textContent = "Save confirmed results";
    saveBtn.addEventListener("click", function(){
      var cleaned = rowsState.filter(function(t){ return t.name; }).map(function(t){
        return {
          section: t.section || null, name: t.name,
          value: t.value === "" ? null : t.value,
          unit: t.unit || null,
          referenceRange: t.referenceRange || null,
          labFlag: t.labFlag || null
        };
      });
      saveConfirmedResults(reportId, cleaned);
    });
    var discardBtn = document.createElement("button");
    discardBtn.className = "fin-edit-btn"; discardBtn.textContent = "Discard";
    discardBtn.addEventListener("click", function(){ medicalDetailContainer.innerHTML = ""; });
    btnRow.appendChild(saveBtn);
    btnRow.appendChild(discardBtn);
    medicalDetailContainer.appendChild(btnRow);
  }

  function saveConfirmedResults(reportId, tests){
    medicalDetailContainer.innerHTML = '<p class="empty">Saving\u2026</p>';

        method: "POST",

  function viewConfirmedResults(reportId){
    if(!medicalDetailContainer) return;

  function renderHighlightedResults(results){
    medicalDetailContainer.innerHTML = "";

    var disclaimer = document.createElement("p");
    disclaimer.style.cssText = "margin-bottom:16px; padding:12px 16px; border:1px solid rgba(232,93,117,0.3); border-radius:10px; background:rgba(232,93,117,0.06); font-size:13px; line-height:1.6;";
    disclaimer.innerHTML = "<strong>This is a report-reading aid, not a medical assessment.</strong> Each status only compares a value to the range printed on this specific report. There is no overall health score here, nothing here diagnoses a condition, and results showing \ud83d\udfe2 do not mean you're healthy. Confirmed " + new Date(results.confirmedAt).toLocaleString("en-IN") + ".";
    medicalDetailContainer.appendChild(disclaimer);

    var tableWrap = document.createElement("div");
    tableWrap.className = "fin-table-wrap";
    var table = document.createElement("table");
    table.className = "fin-table";
    table.innerHTML = "<thead><tr><th>Status</th><th>Test</th><th>Value</th><th>Reference range</th><th>Section</th><th>Why</th></tr></thead>";
    var tbody = document.createElement("tbody");

    var rows = (results.tests || []).map(function(t){
      return { test: t, status: computeTestStatus(t) };
    });
    // Needs-attention first: critical, then outside range, then unverified,
    // then confirmed-normal last. Stable within each group (keeps the
    // report's own original order among equally-ranked rows).
    rows = rows.map(function(r, i){ return { r: r, i: i }; })
      .sort(function(a, b){
        var diff = MEDICAL_STATUS_SORT_ORDER[a.r.status.status] - MEDICAL_STATUS_SORT_ORDER[b.r.status.status];
        return diff !== 0 ? diff : a.i - b.i;
      })
      .map(function(x){ return x.r; });

    rows.forEach(function(row){
      var t = row.test;
      var status = row.status;
      var color = MEDICAL_STATUS_COLORS[status.status];
      var tr = document.createElement("tr");
      tr.className = "fin-row";
      tr.innerHTML =
        '<td><span style="display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-family:\'JetBrains Mono\',monospace; background:' + color + '22; color:' + color + ';">' + MEDICAL_STATUS_LABELS[status.status] + '</span></td>' +
        "<td>" + escapeHtml(t.name || "") + "</td>" +
        "<td>" + escapeHtml(((t.value === null || t.value === undefined) ? "\u2014" : t.value) + (t.unit ? (" " + t.unit) : "")) + "</td>" +
        "<td>" + escapeHtml(t.referenceRange || "\u2014") + "</td>" +
        '<td style="font-size:11px; color:var(--faint);">' + escapeHtml(t.section || "\u2014") + "</td>" +
        '<td style="font-size:12px; color:var(--faint);">' + escapeHtml(status.reason) + "</td>";
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    medicalDetailContainer.appendChild(tableWrap);

    var closeBtn = document.createElement("button");
    closeBtn.className = "fin-edit-btn"; closeBtn.style.marginTop = "14px"; closeBtn.textContent = "Close";
    closeBtn.addEventListener("click", function(){ medicalDetailContainer.innerHTML = ""; });
    medicalDetailContainer.appendChild(closeBtn);
  }

  function fetchMedicalReportBlob(reportId){

      return fetch(MEDICAL_ENDPOINT + "?id=" + encodeURIComponent(reportId) + "&action=file", medicalFetchOpts(token));
    }).then(function(res){
      if(!res.ok) throw new Error("fetch failed");
      return res.blob();
    });

  function viewMedicalReport(reportId){
    fetchMedicalReportBlob(reportId).then(function(blob){
      var url = URL.createObjectURL(blob);
      window.open(url, "_blank");
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    }).catch(function(){ alert("Could not open this report. Try again."); });

  function downloadMedicalReport(reportId, filename){
    fetchMedicalReportBlob(reportId).then(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    }).catch(function(){ alert("Could not download this report. Try again."); });
  }

  function deleteMedicalReport(reportId){

    var user = window.netlifyIdentity.currentUser();
    user.jwt().then(function(token){
      return fetch(MEDICAL_ENDPOINT + "?id=" + encodeURIComponent(reportId), medicalFetchOpts(token, { method: "DELETE" }));
    }).then(function(res){
      if(!res.ok) throw new Error("delete failed");
      refreshMedicalReportsList();
    }).catch(function(){ alert("Could not delete this report. Try again."); });

  function uploadMedicalReport(file, reportDate, statusEl, uploadBtn){
    if(MEDICAL_ALLOWED_MIME.indexOf(file.type) === -1){
      alert("Only PDF, JPG, and PNG files are allowed.");
      return;
    }
    if(file.size > MEDICAL_MAX_BYTES){
      alert("This file is too large \u2014 please keep reports under 4MB for now.");
      return;
    }
    uploadBtn.disabled = true;
    if(statusEl) statusEl.textContent = "Uploading\u2026";
    var reader = new FileReader();
    reader.onload = function(){
      var base64 = reader.result.split(",")[1];
      var user = window.netlifyIdentity.currentUser();
      user.jwt().then(function(token){
        return fetch(MEDICAL_ENDPOINT, medicalFetchOpts(token, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ filename: file.name, mimeType: file.type, reportDate: reportDate || null, fileBase64: base64 })
        }));

  function formatMonthYear(dateStr){
    if(!dateStr) return "";
    var d = new Date(dateStr + "T00:00:00");
    if(isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString("en-US", { month: "short", year: "numeric" });
  }

  // Mobile date pickers can fire "change" mid-entry (e.g. before all four
  // digits of a year are typed), so date fields no longer try to intercept or
  // reject values in real time -- that fought against normal typing in
  // unpredictable ways depending on exactly how a given browser fires these
  // events. Instead, an implausible year is simply flagged after the fact,
  // wherever a date is displayed, without ever blocking what you type.
  function isPlausibleDateValue(v){
    if(!v) return true;
    var m = v.match(/^(\d{4})-\d{2}-\d{2}$/);
    if(!m) return false;
    var year = parseInt(m[1], 10);
    var maxYear = new Date().getFullYear() + 1;
    return year >= 1900 && year <= maxYear;
  }

  function dateWarningSuffix(dateStr){
    if(!dateStr || isPlausibleDateValue(dateStr)) return "";
    return ' <span title="This year looks off \u2014 check and re-enter it" style="color:#E85D75;">\u26a0</span>';
  }

  function formatEmploymentDuration(startDate, endDate){
    if(!startDate) return "";
    var start = new Date(startDate + "T00:00:00");
    if(isNaN(start.getTime())) return "";
    var end = endDate ? new Date(endDate + "T00:00:00") : new Date();
    var totalMonths = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
    if(end.getDate() < start.getDate()) totalMonths -= 1;
    if(totalMonths < 0) totalMonths = 0;
    var years = Math.floor(totalMonths / 12);
    var months = totalMonths % 12;
    var parts = [];
    if(years > 0) parts.push(years + " yr" + (years === 1 ? "" : "s"));
    if(months > 0 || parts.length === 0) parts.push(months + " mo" + (months === 1 ? "" : "s"));
    return parts.join(" ");
  }

  // Display-only grouping/sorting -- never mutates state.professional.employers
  // itself or any stored date. An employer with no start date is never guessed
  // into a position on the sorted timeline; it goes in its own Undated group.
  function sortedEmployersForTimeline(){
    var dated = state.professional.employers.filter(function(e){ return !!e.startDate; });
    var undated = state.professional.employers.filter(function(e){ return !e.startDate; });
    dated = dated.slice().sort(function(a,b){ return a.startDate.localeCompare(b.startDate); });
    return { dated: dated, undated: undated };
  }

  // Display-only role ordering within a card -- never mutates emp.roles itself.
  function sortedRolesForDisplay(emp){
    return emp.roles.slice().sort(function(a,b){
      var as = a.startDate || "", bs = b.startDate || "";
      if(as && bs) return as.localeCompare(bs);
      if(as) return -1;
      if(bs) return 1;
      return 0;
    });
  }

  var VTIMELINE_COLORS = [FINANCE_ACCENT, "#E8A34C", MEDICAL_ACCENT, PROFESSIONAL_ACCENT, GOALS_ACCENT];

  function allProfessionalRoleMilestones(){
    var out = [];
    var skippedEmployers = 0;
    state.professional.employers.forEach(function(emp){
      var datedRoles = emp.roles.filter(function(r){ return !!r.startDate; });
      if(datedRoles.length){
        datedRoles.forEach(function(role){
          out.push({ employerName: emp.employerName || "(unnamed employer)", jobTitle: role.jobTitle || "(untitled role)", startDate: role.startDate });
        });
      }else if(emp.startDate){
        // No role has its own start date -- but the employer itself does (this
        // is how the form is filled in for a single, undivided stint), so use
        // that instead of showing nothing for this employer.
        var soleTitle = (emp.roles.length === 1 && emp.roles[0].jobTitle) ? emp.roles[0].jobTitle : null;
        out.push({ employerName: emp.employerName || "(unnamed employer)", jobTitle: soleTitle, startDate: emp.startDate });
      }else{
        skippedEmployers++;
      }
    });
    out.sort(function(a,b){ return a.startDate.localeCompare(b.startDate); });
    return { milestones: out, skippedEmployers: skippedEmployers };
  }

      var item = document.createElement("div");

        del.className = "r-del"; del.textContent = "\u00d7";
        del.addEventListener("click", function(){
          state.reviews = state.reviews.filter(function(x){ return x.id !== r.id; });
          scheduleSave(); renderMain();
        });
        item.appendChild(del);
        view.appendChild(item);
      });
    }
  }

  /* ---------------- clock ---------------- */
  function tickClock(){
    var now = new Date();
    document.getElementById("clockLine").textContent =
      now.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit"}) + " \u00b7 " +
      now.toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"});
  }

  /* ---------------- controls ---------------- */
  document.getElementById("exportBtn").addEventListener("click", function(){
    try{
      var blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "aman-mlg-life-tracker-" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(e){ console.error("export failed", e); }
  });
  document.getElementById("importBtn").addEventListener("click", function(){ document.getElementById("importFile").click(); });
  document.getElementById("importFile").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        var base = hydrateState(parsed);
        state = base;
        scheduleSave(); renderMain();
      }catch(err){ alert("Could not read that file \u2014 is it a life tracker export?"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });
  document.getElementById("resetBtn").addEventListener("click", function(){
    if(!confirm("Reset all data on this device? This can't be undone unless you've exported a backup.")) return;
    state = defaultState();
    scheduleSave(); renderMain();
  });

  function flushSaveNow(){
    clearTimeout(saveTimer);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.error("flush save failed", e); }
  }
  window.addEventListener("beforeunload", flushSaveNow);
  window.addEventListener("pagehide", flushSaveNow);
  document.addEventListener("visibilitychange", function(){ if(document.hidden) flushSaveNow(); });

  /* ---------------- cloud sync (Netlify Identity + Netlify DB) ---------------- */

  var SYNC_ENDPOINT = "/.netlify/functions/sync-data";
  // Captured once, immediately, before the Identity widget has a chance to process
  // and clear the URL hash. A recovery/invite/confirmation link lands here with a
  // token in the hash; GoTrue establishes a session for it and fires the same
  // "login" event as a normal login -- if we don't know this was a recovery link,
  // we'd wrongly auto-close the widget's "set a new password" screen below.
  var arrivedViaRecoveryLink = /recovery_token=|invite_token=|confirmation_token=|email_change_token=/.test(window.location.hash || "");
  var syncEnabled = false;
  var lastSyncedJSON = null;
  var lastKnownAuthId = null;
  var lastKnownServerUpdatedAt = null;
  var syncInFlight = false;
  var LOGIN_TS_KEY = "aman-mlg-login-ts";

  function recordLoginTimestamp(){
    try{ if(!localStorage.getItem(LOGIN_TS_KEY)) localStorage.setItem(LOGIN_TS_KEY, new Date().toISOString()); }catch(e){}
  }
  function clearLoginTimestamp(){ try{ localStorage.removeItem(LOGIN_TS_KEY); }catch(e){} }
  function getLoginTimestamp(){ try{ return localStorage.getItem(LOGIN_TS_KEY); }catch(e){ return null; } }

  // Called with whatever forceLogoutAt the server last reported. If it's newer
  // than when THIS device logged in, someone (possibly this same device, from
  // another tab) asked every device to sign out -- so this one does too.
  function handleForceLogoutCheck(forceLogoutAt){
    if(!forceLogoutAt || !syncEnabled) return;
    var loginTs = getLoginTimestamp();
    if(!loginTs) return;
    if(new Date(forceLogoutAt).getTime() > new Date(loginTs).getTime()){
      setSyncStatus("Signed out (from another device)");
      window.netlifyIdentity.logout();
    }
  }

  function checkRemoteFlags(){
    if(!window.netlifyIdentity) return;
    var user = window.netlifyIdentity.currentUser();
    if(!user) return;
    user.jwt().then(function(token){
      return fetch(SYNC_ENDPOINT, { headers: { "Authorization": "Bearer " + token } });
    }).then(function(res){ return res.json(); }).then(function(result){
      if(result) handleForceLogoutCheck(result.forceLogoutAt);
    }).catch(function(){});
  }

  function setSyncStatus(text){
    var el = document.getElementById("syncStatus");
    if(el) el.textContent = text;
  }

  function updateAuthUI(user){
    var authBtn = document.getElementById("authBtn");
    var logoutAllBtn = document.getElementById("logoutAllBtn");
    if(user){
      syncEnabled = true;
      authBtn.textContent = "Sign out (" + user.email + ")";
      if(logoutAllBtn) logoutAllBtn.style.display = "";
      setSyncStatus("Synced");
    }else{
      syncEnabled = false;
      lastSyncedJSON = null;
      authBtn.textContent = "Sign in to sync";
      if(logoutAllBtn) logoutAllBtn.style.display = "none";
      setSyncStatus("Not signed in");
    }
  }

  function doPush(token, json){
    return fetch(SYNC_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ data: state })
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(body){ return { res:res, body:body }; });
    }).then(function(r){
      if(r.res && r.res.ok){
        lastSyncedJSON = json;
        if(r.body && r.body.updatedAt) lastKnownServerUpdatedAt = r.body.updatedAt;
        setSyncStatus("Synced");
      }else{
        setSyncStatus("Sync failed \u2014 will retry");
      }
    });
  }

  function pushToServer(){
    if(!syncEnabled || !window.netlifyIdentity) return;
    var user = window.netlifyIdentity.currentUser();
    if(!user) return;
    var json = JSON.stringify(state);
    if(json === lastSyncedJSON || syncInFlight) return;
    syncInFlight = true;
    setSyncStatus("Syncing\u2026");
    user.jwt().then(function(token){
      return doPush(token, json);
    }).then(function(){
      syncInFlight = false;
    }).catch(function(e){
      syncInFlight = false;
      console.error("sync push failed", e);
      setSyncStatus("Sync failed \u2014 will retry");
    });
  }

  function pullFromServer(promptFirst){
    if(!window.netlifyIdentity) return Promise.resolve();
    var user = window.netlifyIdentity.currentUser();
    if(!user) return Promise.resolve();
    setSyncStatus("Checking cloud data\u2026");
    return user.jwt().then(function(token){
      return fetch(SYNC_ENDPOINT, { headers: { "Authorization": "Bearer " + token } });
    }).then(function(res){ return res.json(); }).then(function(result){
      if(result) handleForceLogoutCheck(result.forceLogoutAt);
      if(!result || !result.data){ setSyncStatus("Synced"); return; }
      var proceed = true;
      if(promptFirst){
        proceed = confirm("Load your saved data from the cloud? This will replace what's currently shown in this browser on this device.");
      }
      if(proceed){
        state = hydrateState(result.data);
        lastSyncedJSON = JSON.stringify(state);
        if(result.updatedAt) lastKnownServerUpdatedAt = result.updatedAt;
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
        renderMain();
      }
      setSyncStatus("Synced");
    }).catch(function(e){
      console.error("sync pull failed", e);
      setSyncStatus("Could not reach cloud data");
    });
  }

  if(window.netlifyIdentity){
    window.netlifyIdentity.on("init", function(user){
      lastKnownAuthId = user ? user.id : null;
      updateAuthUI(user);
      if(user){ recordLoginTimestamp(); pullFromServer(true); }
    });
    window.netlifyIdentity.on("login", function(user){
      lastKnownAuthId = user ? user.id : null;
      recordLoginTimestamp();
      updateAuthUI(user);
      if(!arrivedViaRecoveryLink){
        window.netlifyIdentity.close();
        pullFromServer(true);
      }
      // If this login came from a recovery/invite/confirmation link, the widget
      // shows its own "set a new password" screen next -- don't compete with it
      // by popping a confirm() dialog too. The deferred "close" handler below
      // runs the cloud-data check once that screen is actually gone.
    });
    window.netlifyIdentity.on("logout", function(){
      lastKnownAuthId = null;
      clearLoginTimestamp();
      updateAuthUI(null);
    });
    window.netlifyIdentity.on("close", function(){
      if(arrivedViaRecoveryLink){
        arrivedViaRecoveryLink = false;
        pullFromServer(true);
      }
    });
    window.netlifyIdentity.init();

    // If you log in (or out) in one tab -- e.g. clicking the email confirmation
    // link, which opens a new tab -- this notices the change in any other open
    // tab and updates it automatically, instead of leaving it stuck showing
    // "Not signed in" until manually refreshed.
    window.addEventListener("storage", function(){
      var user = window.netlifyIdentity.currentUser();
      var currentId = user ? user.id : null;
      if(currentId !== lastKnownAuthId){
        lastKnownAuthId = currentId;
        updateAuthUI(user);
        if(user) pullFromServer(true);
      }
    });

    // Catches "log out everywhere" even on a device that's just sitting open
    // and idle -- checked periodically, and immediately whenever you switch
    // back to this tab.
    setInterval(checkRemoteFlags, 120000);
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden) checkRemoteFlags();
    });
  }

  document.getElementById("authBtn").addEventListener("click", function(){
    if(!window.netlifyIdentity) return;
    var user = window.netlifyIdentity.currentUser();
    if(user) window.netlifyIdentity.logout();
    else window.netlifyIdentity.open("login");
  });

  document.getElementById("logoutAllBtn").addEventListener("click", function(){
    if(!window.netlifyIdentity) return;
    var user = window.netlifyIdentity.currentUser();
    if(!user) return;
    if(!confirm("Sign out of this account on every device? Other signed-in devices will be signed out the next time they check in (usually within a couple of minutes, or immediately if in use).")) return;
    user.jwt().then(function(token){
      return fetch(SYNC_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ action: "force_logout_all" })
      });
    }).then(function(){
      window.netlifyIdentity.logout();
    }).catch(function(e){
      console.error("logout-all failed", e);
      alert("Could not reach the server -- this device wasn't signed out. Try again.");
    });
  });

  buildTabs();
  renderMain();
  tickClock();
  setInterval(tickClock, 1000);
})();
</script>
</body>
</html>
