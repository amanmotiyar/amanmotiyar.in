<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aman — Multi Level Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#170F2A;
    --bg-2:#241A3D;
    --ink:#F4ECD8;
    --muted:#B9A9D6;
    --faint:#7A6B99;
    --line:rgba(212,175,55,0.20);
    --gold:#D4AF37;
    --gold-2:#E8C766;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Manrope', ui-sans-serif, system-ui, sans-serif;
    font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  ::selection{ background:var(--gold); color:#1B140A; }
  button, select, textarea, input{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  ::-webkit-scrollbar{ width:9px; } ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:20px; } ::-webkit-scrollbar-track{ background:transparent; }

  .app{ min-height:100vh; display:flex; flex-direction:column; position:relative; }

  .aura{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .aura-layer{
    position:absolute; width:70vw; height:70vw; max-width:900px; max-height:900px;
    top:-12%; right:-10%; border-radius:50%; filter:blur(110px);
    opacity:0; transition:opacity .5s ease; background:radial-gradient(circle, var(--gold) 0%, transparent 70%);
  }
  .aura-layer.on{ opacity:0.30; }

  .rule-gold{ position:fixed; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--gold), transparent); z-index:2; }

  /* ---- top bar ---- */
  .topbar{
    position:relative; z-index:1; flex:0 0 auto; padding:20px 40px 16px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .name{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:19px; color:var(--gold-2); }
  .brand .sub{ font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.08em; color:var(--faint); }
  .topright{ display:flex; align-items:center; gap:12px; }
  .clock{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); }
  .util-btn{
    background:transparent; border:1px solid var(--line); color:var(--gold-2);
    border-radius:20px; padding:7px 15px; font-size:11.5px; cursor:pointer; transition:all .2s ease;
  }
  .util-btn:hover{ background:var(--gold); color:#1B140A; border-color:var(--gold); }

  .tabs{ position:relative; z-index:1; display:flex; gap:6px; flex-wrap:wrap; padding:0 40px 24px; }
  .tab-btn{
    border:1px solid var(--line); background:transparent; color:var(--muted);
    font-size:12px; padding:8px 17px; border-radius:20px; cursor:pointer; transition:all .25s cubic-bezier(.4,0,.2,1);
  }
  .tab-btn.active{ font-weight:700; border-color:transparent; }
  .tab-btn:hover:not(.active){ border-color:var(--gold); color:var(--ink); }

  .stage{ position:relative; z-index:1; flex:1; padding:6px 40px 60px; }
  .view{ opacity:0; transform:translateY(10px); animation:viewIn .4s cubic-bezier(.16,1,.3,1) forwards; max-width:1360px; margin:0 auto; }
  @keyframes viewIn{ to{ opacity:1; transform:translateY(0); } }

  .hero-greet{ font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500; font-size:15px; color:var(--muted); margin:0 0 4px; }
  .hero-title{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:42px; margin:0 0 8px; color:var(--ink); }
  .hero-loop{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--faint); margin:0 0 34px; }

  .tiles{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; margin-bottom:40px; }
  .tile{
    background:var(--bg-2); border:1px solid var(--line); border-radius:14px; padding:19px;
    cursor:pointer; position:relative; overflow:hidden;
    display:flex; flex-direction:column; gap:9px; min-height:126px;
    transition:transform .22s cubic-bezier(.4,0,.2,1), box-shadow .22s ease, border-color .22s ease;
  }
  .tile:hover{ transform:translateY(-3px); box-shadow:0 14px 32px rgba(0,0,0,0.35); border-color:var(--gold); }
  .tile h3{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:18px; margin:0; color:var(--ink); }
  .tile p.tsub{ margin:0; font-size:11px; color:var(--faint); }
  .tile .preview{ font-size:12.5px; color:var(--muted); margin-top:auto; }
  .status-chip{ align-self:flex-start; font-size:9.5px; font-family:'JetBrains Mono', monospace; padding:3px 9px; border-radius:20px; background:rgba(212,175,55,0.12); color:var(--gold-2); }

  .sec-title{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:18px; margin:0 0 14px; color:var(--ink); }
  .attn-row{ display:flex; gap:14px; align-items:baseline; padding:11px 0; border-bottom:1px dashed var(--line); }
  .attn-row .dot{ width:7px; height:7px; border-radius:50%; margin-top:6px; }
  .attn-row .a-name{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:14.5px; flex:0 0 140px; color:var(--ink); }
  .attn-row .a-text{ color:var(--muted); font-size:13.5px; }
  .empty{ color:var(--faint); font-size:13px; font-style:italic; }

  /* ---- domain focus split ---- */
  .focus-split{ display:flex; gap:56px; flex-wrap:wrap; }
  .focus-left{ flex:1 1 560px; max-width:660px; }
  .focus-eyebrow{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.08em; color:var(--faint); }
  .focus-title{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:44px; margin:6px 0 30px; letter-spacing:-0.01em; color:var(--ink); }

  .frow{ padding:17px 0; border-top:1px solid var(--line); }
  .frow.next{ border-bottom:1px solid var(--line); }
  .frow label{ display:block; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--faint); margin-bottom:8px; }
  .frow textarea{
    width:100%; resize:none; overflow:hidden; background:transparent; border:none; padding:0;
    font-family:'Cormorant Garamond', serif; font-size:17px; color:var(--ink); line-height:1.5;
  }
  .frow.next textarea{ font-weight:500; font-size:18px; }
  .frow textarea::placeholder{ color:var(--faint); font-style:italic; }

  .focus-right{ flex:1 1 320px; max-width:420px; display:flex; flex-direction:column; align-items:center; position:relative; }
  .seg{ position:relative; display:flex; gap:3px; margin-bottom:26px; }
  .seg button{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    font-size:11px; padding:6px 14px; border-radius:20px; cursor:pointer; transition:all .2s ease;
  }
  .seg button.on{ font-weight:700; border-color:transparent; }

  .dial-wrap{ position:relative; width:230px; height:230px; }
  .dial-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .dial-center .dv{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:22px; color:var(--ink); }
  .dial-center .dl{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--faint); margin-top:4px; }

  .subhead{ display:flex; justify-content:space-between; align-items:center; width:100%; margin:36px 0 12px; }
  .subhead span{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--faint); }
  .add-chip{ background:none; border:1px solid var(--line); color:var(--gold-2); border-radius:20px; padding:5px 14px; font-size:11px; cursor:pointer; }
  .add-chip:hover{ background:var(--gold); color:#1B140A; }
  .sub-list{ width:100%; display:flex; flex-direction:column; gap:8px; }
  .sub-row{
    display:flex; align-items:center; gap:8px; background:var(--bg-2); border:1px solid var(--line); border-radius:10px;
    padding:9px 13px; opacity:0; transform:translateY(6px); animation:rowIn .35s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes rowIn{ to{ opacity:1; transform:translateY(0); } }
  .sub-row input[type="text"]{ background:none; border:none; color:var(--ink); font-size:12.5px; padding:2px; }
  .sub-row .s-name{ flex:1 1 45%; }
  .sub-row .s-url{ flex:1 1 35%; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); }
  .sub-row a.s-link{ text-decoration:none; font-size:12px; }
  .sub-row .s-remove{ background:none; border:none; color:var(--faint); cursor:pointer; font-size:14px; }
  .sub-row .s-remove:hover{ color:#E85D75; }

  /* review */
  .composer{
    background:var(--bg-2); border:1px solid var(--line); border-radius:16px; padding:18px;
    display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; margin-bottom:26px;
  }
  .composer select{ background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px 10px; font-size:12.5px; }
  .composer textarea{
    flex:1 1 260px; min-width:220px; resize:none; overflow:hidden; background:var(--bg); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-family:inherit; font-size:14px;
  }
  .log-btn{ background:var(--gold); color:#1B140A; border:none; border-radius:8px; padding:10px 18px; font-size:13px; font-weight:700; cursor:pointer; }
  .log-btn:hover{ background:var(--gold-2); }
  .r-item{ display:flex; gap:16px; padding:13px 0; border-bottom:1px solid var(--line); }
  .r-item .r-meta{ flex:0 0 130px; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--faint); }
  .r-item .tag{ display:inline-block; margin-top:5px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); font-size:10px; color:var(--muted); }
  .r-item .r-text{ flex:1; font-size:13.8px; white-space:pre-wrap; color:var(--ink); }
  .r-item .r-del{ background:none; border:none; color:var(--faint); cursor:pointer; font-size:14px; }
  .r-item .r-del:hover{ color:#E85D75; }

  /* profile */
  .profile-wrap{ display:flex; gap:56px; flex-wrap:wrap; }
  .profile-card{
    flex:0 0 260px; display:flex; flex-direction:column; align-items:center; text-align:center;
    background:var(--bg-2); border:1px solid var(--line); border-radius:16px; padding:28px 22px;
  }
  .photo-circle{
    width:140px; height:140px; border-radius:50%; overflow:hidden; margin-bottom:16px;
    background:rgba(212,175,55,0.08); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
  }
  .photo-circle img{ width:100%; height:100%; object-fit:cover; }
  .photo-circle .ph{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--faint); text-align:center; padding:0 10px; }
  .profile-card h2{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:22px; margin:4px 0 2px; color:var(--ink); }
  .profile-card .city{ color:var(--muted); font-size:12.5px; }
  .photo-actions{ display:flex; gap:8px; margin-top:14px; }

  .profile-fields{ flex:1 1 480px; display:grid; grid-template-columns:1fr 1fr; gap:20px 28px; }
  @media (max-width:640px){ .profile-fields{ grid-template-columns:1fr; } }
  .pfield label{ display:block; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--faint); margin-bottom:7px; }
  .pfield input, .pfield select{
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--line);
    padding:5px 2px; font-family:'Cormorant Garamond', serif; font-size:16px; color:var(--ink);
  }
  .pfield input::placeholder{ color:var(--faint); font-style:italic; }
  .pfield input:focus, .pfield select:focus{ border-bottom-color:var(--gold); }
  .pfield select{ appearance:none; }
  .pfield select option{ background:var(--bg-2); color:var(--ink); }

  /* finance */
  .fin-header{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:18px; margin-bottom:28px; }
  .fin-mode-toggle{ display:flex; gap:6px; margin-bottom:28px; }
  .fin-mode-toggle button{
    background:var(--bg-2); border:1px solid var(--line); color:var(--muted);
    border-radius:20px; padding:8px 16px; font-size:12px; cursor:pointer; transition:all .2s ease;
  }
  .fin-mode-toggle button.on{ background:var(--gold); color:#1B140A; border-color:transparent; font-weight:700; }
  .fin-mode-toggle button:hover:not(.on){ border-color:var(--gold); color:var(--ink); }
  .fin-controls{ display:flex; align-items:flex-end; gap:22px; flex-wrap:wrap; }
  .fin-ctl label{ display:block; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--faint); margin-bottom:6px; }
  .fin-select, .fin-target-input{
    background:var(--bg-2); border:1px solid var(--line); color:var(--ink); border-radius:8px;
    padding:8px 12px; font-size:13px; font-family:'JetBrains Mono', monospace;
  }
  .fin-target-input{ width:74px; }
  .fin-badge{ font-family:'JetBrains Mono', monospace; font-size:11px; padding:7px 15px; border-radius:20px; border:1px solid var(--line); white-space:nowrap; }

  .fin-summary{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:36px; }
  .fin-card{ background:var(--bg-2); border:1px solid var(--line); border-radius:12px; padding:15px 16px; }
  .fin-card .fc-label{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--faint); margin-bottom:7px; }
  .fin-card .fc-value{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:20px; color:var(--ink); }

  .fin-table-wrap{ overflow-x:auto; margin-bottom:6px; }
  table.fin-table{ width:100%; border-collapse:collapse; font-size:12.8px; min-width:760px; }
  table.fin-table th{ text-align:left; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--faint); padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.fin-table td{ padding:10px; border-bottom:1px solid var(--line); color:var(--ink); white-space:nowrap; }
  tr.fin-row:hover td{ background:rgba(212,175,55,0.05); }
  .fin-edit-btn{ background:none; border:1px solid var(--line); color:var(--gold-2); border-radius:16px; padding:4px 13px; font-size:11px; cursor:pointer; }
  .fin-edit-btn:hover{ background:var(--gold); color:#1B140A; }
  tr.fin-edit-row td{ border-bottom:1px solid var(--line); padding:22px 16px 28px; background:var(--bg-2); white-space:normal; }
  .fin-groups{ display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:26px; margin-bottom:18px; }
  .fin-group h4{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--faint); margin:0 0 10px; letter-spacing:0.05em; }
  .fin-group .fg-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); }
  .fin-group .fg-row label{ font-size:12px; color:var(--muted); }
  .fin-group .fg-row input{ width:110px; text-align:right; background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:12.5px; padding:3px 2px; }
  .fin-group .fg-row input:focus{ border-bottom-color:var(--gold); }
  .fin-notes label{ display:block; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--faint); margin-bottom:8px; }
  .fin-notes textarea{ width:100%; min-height:60px; resize:vertical; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:10px; font-family:inherit; font-size:13px; }
  .fin-toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .fin-toolbar button{ background:none; border:1px solid var(--line); color:var(--gold-2); border-radius:16px; padding:6px 14px; font-size:11px; cursor:pointer; transition:all .18s ease; }
  .fin-toolbar button:hover:not(:disabled){ background:var(--gold); color:#1B140A; }
  .fin-toolbar button:disabled{ opacity:0.35; cursor:not-allowed; }
  .fin-toolbar button.fin-close-btn{ margin-left:auto; color:var(--muted); }
  .fin-toolbar button.fin-clear-btn:hover{ background:#E85D75; border-color:#E85D75; color:#1B140A; }

  .fin-section{ margin-top:46px; }
  .fin-breakdown-wrap{ overflow-x:auto; }
  table.fin-breakdown{ width:100%; border-collapse:collapse; font-size:12.8px; min-width:440px; }
  table.fin-breakdown th{ text-align:left; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--faint); padding:9px 10px; border-bottom:1px solid var(--line); }
  table.fin-breakdown td{ padding:9px 10px; border-bottom:1px solid var(--line); color:var(--ink); }
  table.fin-breakdown td.fb-num{ text-align:right; font-family:'JetBrains Mono', monospace; }

  .fin-insights-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:12px; }
  .fin-insight-card{ background:var(--bg-2); border:1px solid var(--line); border-radius:12px; padding:15px 16px; }
  .fin-insight-card .fc-label{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--faint); margin-bottom:7px; }
  .fin-insight-card .fc-value{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:17px; color:var(--ink); line-height:1.3; }

  .saved-flag{
    position:fixed; bottom:18px; left:18px; z-index:5;
    background:var(--gold); color:#1B140A; font-size:11px; font-family:'JetBrains Mono', monospace; padding:6px 12px; border-radius:20px;
    opacity:0; transform:translateY(6px); transition:opacity .35s ease, transform .35s ease; pointer-events:none;
  }
  .saved-flag.show{ opacity:0.96; transform:translateY(0); }

  @media (max-width:720px){
    .topbar, .tabs, .stage{ padding-left:20px; padding-right:20px; }
    .focus-title{ font-size:32px; }
  }
</style>
</head>
<body>
<div class="rule-gold"></div>
<div class="aura"><div class="aura-layer on" id="aura"></div></div>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="name">Aman</span><span class="sub">MULTI LEVEL GROWTH</span></div>
    <div class="topright">
      <span class="clock" id="clockLine">—</span>
      <button class="util-btn" id="exportBtn">Export</button>
      <button class="util-btn" id="importBtn">Import</button>
      <button class="util-btn" id="resetBtn">Reset</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stage" id="stage">
    <div id="main"></div>
  </div>
</div>
<div class="saved-flag" id="savedFlag">saved</div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "aman-mlg-life-tracker-v2";

  var DOMAIN_DEFS = [
    { key:"investments", name:"Investments", subtitle:"Portfolio & net worth", accent:"#E3B14A", gem:"Citrine",
      subs:[ {name:"Investment Tracker", url:""}, {name:"Net Worth", url:""}, {name:"Portfolio Review", url:""} ] },
    { key:"professional", name:"Professional", subtitle:"Career & craft", accent:"#5B8DEF", gem:"Sapphire",
      subs:[ {name:"Professional Profile", url:""}, {name:"Skills & Competencies", url:""}, {name:"Career Strategy", url:""} ] },
    { key:"dreams", name:"Dreams & Goals", subtitle:"Vision & aspirations", accent:"#B98CE8", gem:"Amethyst",
      subs:[ {name:"Dreams & Vision", url:""}, {name:"Goals", url:""}, {name:"Bucket List", url:""} ] },
    { key:"mental", name:"Mental Life", subtitle:"Mind & inner world", accent:"#D9D3E6", gem:"Pearl",
      subs:[ {name:"Journaling", url:""}, {name:"Mindfulness Practice", url:""}, {name:"Reflection Notes", url:""} ] },
    { key:"health", name:"Health", subtitle:"Body & recovery", accent:"#E85D75", gem:"Ruby",
      subs:[ {name:"Health Report Upload", url:""}, {name:"Key Findings", url:""}, {name:"Abnormal Values", url:""}, {name:"Borderline Values", url:""}, {name:"Doctor Questions", url:""}, {name:"Lifestyle Actions", url:""}, {name:"Follow-up Date", url:""}, {name:"Next Test Date", url:""} ] }
  ];

  var FINANCE_ACCENT = "#34C99B";
  var FINANCE_GEM = "Emerald";
  var FINANCE_ATTENTION_COLOR = "#E8C766";
  var FINANCE_NEGATIVE_COLOR = "#E85D75";

  var NAV_ITEMS = [
    {key:"overview", label:"Overview"},
    {key:"profile", label:"Profile"},
    {key:"finance", label:"Finance"},
    {key:"investments", label:"Investments"},
    {key:"professional", label:"Professional"},
    {key:"dreams", label:"Dreams & Goals"},
    {key:"mental", label:"Mental Life"},
    {key:"health", label:"Health"},
    {key:"review", label:"Review Log"}
  ];

  var PROFILE_FIELDS = [
    ["fullName","Full Name","text"],
    ["phone","Phone Number","tel"],
    ["email","Email","email"],
    ["city","City","text"],
    ["linkedin","LinkedIn / Portfolio","text"],
    ["emergencyContact","Emergency Contact","text"],
    ["bloodGroup","Blood Group","select"],
    ["dob","Date of Birth","date"]
  ];
  var BLOOD_GROUPS = ["", "A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-", "Unknown"];

  var FIELD_ORDER = [ ["current","Current"], ["target","Target"], ["gap","Gap"], ["nextAction","Next action"] ];
  var STATUS_LEVELS = { steady:1, attention:0.7, stalled:0.45 };
  var GOLD = "#D4AF37";

  var MONTHS = ["Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar"];
  var INCOME_FIELDS = [
    ["salary","Salary"], ["bonus","Bonus"], ["freelance","Freelance / Business Income"],
    ["interest","Interest Income"], ["rental","Rental Income"], ["otherIncome","Other Income"]
  ];
  var DEDUCTION_FIELDS = [
    ["taxTds","Tax / TDS"], ["otherDeductions","Other Deductions"]
  ];
  var INVESTMENT_FIELDS = [
    ["pf","PF"], ["nps","NPS"]
  ];
  var EXPENSE_FIELDS = [
    ["rent","Rent / Housing"], ["electricity","Electricity"], ["internet","Internet / Mobile"],
    ["groceries","Groceries"], ["foodOutside","Food Outside"], ["transport","Transport / Fuel"],
    ["insurance","Insurance"], ["medical","Medical / Health"], ["family","Family / Household"],
    ["fees","Fees / Education"], ["subscriptions","Subscriptions"], ["shopping","Shopping"],
    ["travel","Travel"], ["entertainment","Entertainment"], ["loanEmi","Loan / EMI"],
    ["creditCard","Credit Card Payment"], ["gifts","Gifts / Donations"], ["misc","Miscellaneous"]
  ];

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function escapeHtml(str){ var d=document.createElement("div"); d.textContent = str; return d.innerHTML; }
  function fmtINR(n){
    n = Math.round(n || 0);
    var sign = n < 0 ? "-" : "";
    return sign + "\u20b9" + Math.abs(n).toLocaleString("en-IN");
  }
  function fmtPct(n){ return isFinite(n) ? n.toFixed(1) + "%" : "\u2014"; }
  function fmtINRz(n){ return (Math.round(n || 0) === 0) ? "\u2014" : fmtINR(n); }
  function fmtPctz(n){ return (!isFinite(n) || n === 0) ? "\u2014" : fmtPct(n); }

  function fyLabel(startYear){ var end = (startYear + 1) % 100; return startYear + "-" + (end < 10 ? "0" + end : end); }
  function computeCurrentFY(){
    var now = new Date(); var y = now.getFullYear(); var m = now.getMonth();
    var startYear = m >= 3 ? y : y - 1;
    return fyLabel(startYear);
  }
  function fyOptions(){
    var cur = computeCurrentFY();
    var curStart = parseInt(cur.split("-")[0], 10);
    var opts = [];
    for(var y = curStart - 3; y <= curStart + 2; y++){ opts.push(fyLabel(y)); }
    return opts;
  }

  function newMonthObj(){
    var o = {};
    INCOME_FIELDS.concat(DEDUCTION_FIELDS).concat(INVESTMENT_FIELDS).concat(EXPENSE_FIELDS).forEach(function(f){ o[f[0]] = 0; });
    o.notes = "";
    return o;
  }
  function ensureFYData(fy){
    if(!state.finance.fy[fy]) state.finance.fy[fy] = { months:{} };
    MONTHS.forEach(function(mo){ if(!state.finance.fy[fy].months[mo]) state.finance.fy[fy].months[mo] = newMonthObj(); });
  }
  function sumFields(obj, fields){ return fields.reduce(function(s,f){ return s + (parseFloat(obj[f[0]]) || 0); }, 0); }
  function monthTotals(m){
    var gross = sumFields(m, INCOME_FIELDS);
    var ded = sumFields(m, DEDUCTION_FIELDS);
    var inv = sumFields(m, INVESTMENT_FIELDS);
    var net = gross - ded - inv;
    var exp = sumFields(m, EXPENSE_FIELDS);
    var sav = net - exp;
    var wealth = sav + inv;
    var rate = net !== 0 ? (sav / net * 100) : 0;
    var wrate = gross !== 0 ? (wealth / gross * 100) : 0;
    return { gross:gross, ded:ded, inv:inv, net:net, exp:exp, sav:sav, wealth:wealth, rate:rate, wrate:wrate };
  }
  function fyAggregate(fy){
    ensureFYData(fy);
    var months = state.finance.fy[fy].months;
    var agg = { gross:0, ded:0, inv:0, net:0, exp:0, sav:0, wealth:0 };
    MONTHS.forEach(function(mo){
      var t = monthTotals(months[mo]);
      agg.gross += t.gross; agg.ded += t.ded; agg.inv += t.inv; agg.net += t.net;
      agg.exp += t.exp; agg.sav += t.sav; agg.wealth += t.wealth;
    });
    agg.rate = agg.net !== 0 ? (agg.sav / agg.net * 100) : 0;
    agg.wrate = agg.gross !== 0 ? (agg.wealth / agg.gross * 100) : 0;
    return agg;
  }
  function financeStatus(){
    var agg = fyAggregate(state.finance.currentFY);
    var target = state.finance.targetSavingsRate;
    if(agg.gross === 0) return { level:null, agg:agg };
    if(agg.sav < 0) return { level:"negative", agg:agg };
    if(agg.rate < target) return { level:"attention", agg:agg };
    return { level:"steady", agg:agg };
  }
  function financeColor(level){
    return level === "steady" ? FINANCE_ACCENT : level === "attention" ? FINANCE_ATTENTION_COLOR : FINANCE_NEGATIVE_COLOR;
  }

  /* ---------------- forecast: constants & assumptions ---------------- */

  var FORECAST_START = { y:2026, m:9 };
  var FORECAST_END = { y:2032, m:6 };
  var EMI_KEYS = ["personalLoan","axisEmi","carEmi","landLoanEmi"];
  var ANNUAL_BILL_KEYS = ["healthInsurance","carInsurance","schoolFeesFeb","schoolFeesJun","schoolFeesOct"];
  var MONTH_NAMES = ["","January","February","March","April","May","June","July","August","September","October","November","December"];

  function defaultForecastAssumptions(){
    return {
      grossSalary: 220000, incomeTax: 30000, pf: 9500, nps: 10000,
      bonusPercent: 5, bonusTaxPercent: 30,
      rentBeforeDec2026: 25000, rentFromDec2026: 26500, rentIncreasePercent: 10,
      milkPerDay: 76, groceries: 4000, vegFruits: 3500, amazonPayLater: 2500,
      electricity: 3000, fuel: 2500, lifeInsurance: 3000, mobile: 1000,
      onlineShoppingFood: 5000, maid: 1200, carWash: 900, stationery: 1500,
      subscriptions: 4000, misc: 5000,
      emis: {
        personalLoan: { label:"Personal loan EMI", amount:10000, endYear:2027, endMonth:8 },
        axisEmi:      { label:"Axis EMI",           amount:10000, endYear:2027, endMonth:8 },
        carEmi:       { label:"Car EMI",             amount:20000, endYear:2027, endMonth:10 },
        landLoanEmi:  { label:"Land loan EMI",       amount:55000, endYear:2032, endMonth:6 }
      },
      annualBills: {
        healthInsurance: { label:"Health insurance", month:4,  amount:20000 },
        carInsurance:    { label:"Car insurance",     month:7,  amount:25000 },
        schoolFeesFeb:   { label:"School fees (Feb)", month:2,  amount:10000 },
        schoolFeesJun:   { label:"School fees (Jun)", month:6,  amount:15000 },
        schoolFeesOct:   { label:"School fees (Oct)", month:10, amount:25000 }
      }
    };
  }

  function mergeForecastAssumptions(base, incoming){
    Object.keys(base).forEach(function(k){
      if(k === "emis" || k === "annualBills") return;
      if(incoming[k] !== undefined) base[k] = incoming[k];
    });
    if(incoming.emis){
      EMI_KEYS.forEach(function(k){
        if(incoming.emis[k]){
          if(incoming.emis[k].amount !== undefined) base.emis[k].amount = incoming.emis[k].amount;
          if(incoming.emis[k].endYear !== undefined) base.emis[k].endYear = incoming.emis[k].endYear;
          if(incoming.emis[k].endMonth !== undefined) base.emis[k].endMonth = incoming.emis[k].endMonth;
        }
      });
    }
    if(incoming.annualBills){
      ANNUAL_BILL_KEYS.forEach(function(k){
        if(incoming.annualBills[k]){
          if(incoming.annualBills[k].month !== undefined) base.annualBills[k].month = incoming.annualBills[k].month;
          if(incoming.annualBills[k].amount !== undefined) base.annualBills[k].amount = incoming.annualBills[k].amount;
        }
      });
    }
  }

  function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
  function ymCompare(y1,m1,y2,m2){ return (y1*12+m1) - (y2*12+m2); }
  function ymLabel(y,m){ return MONTH_NAMES[m].slice(0,3) + " " + y; }

  function forecastRentForMonth(y,m,a){
    if(y < 2026 || (y === 2026 && m < 12)) return a.rentBeforeDec2026;
    var effYear = (m >= 12) ? y : y - 1;
    if(effYear < 2027) return a.rentFromDec2026;
    var bumps = effYear - 2026;
    return Math.round(a.rentFromDec2026 * Math.pow(1 + a.rentIncreasePercent / 100, bumps));
  }

  function computeForecastMonth(y, m, a){
    var days = daysInMonth(y,m);
    var milk = a.milkPerDay * days;
    var rent = forecastRentForMonth(y,m,a);
    var fixedOthers = a.groceries + a.vegFruits + a.amazonPayLater + a.electricity + a.fuel +
      a.lifeInsurance + a.mobile + a.onlineShoppingFood + a.maid + a.carWash + a.stationery +
      a.subscriptions + a.misc;

    var emiTotal = 0; var activeEmis = [];
    EMI_KEYS.forEach(function(k){
      var emi = a.emis[k];
      if(ymCompare(y,m, emi.endYear, emi.endMonth) <= 0){ emiTotal += emi.amount; activeEmis.push(k); }
    });

    var recurringExpenses = rent + milk + fixedOthers + emiTotal;

    var scheduledBills = 0; var billsDue = [];
    ANNUAL_BILL_KEYS.forEach(function(k){
      var b = a.annualBills[k];
      if(b.month === m){ scheduledBills += b.amount; billsDue.push(k); }
    });

    var totalOutflow = recurringExpenses + scheduledBills;

    var grossBonus = 0, bonusTax = 0, netBonus = 0;
    if(m === 12){
      grossBonus = a.grossSalary * 12 * (a.bonusPercent / 100);
      bonusTax = grossBonus * (a.bonusTaxPercent / 100);
      netBonus = grossBonus - bonusTax;
    }
    var netCashIncome = a.grossSalary + grossBonus - a.incomeTax - bonusTax - a.pf - a.nps;
    var cashRemaining = netCashIncome - totalOutflow;

    return {
      year:y, month:m, days:days,
      grossSalary:a.grossSalary, grossBonus:grossBonus, netBonus:netBonus, regularTax:a.incomeTax, bonusTax:bonusTax,
      pf:a.pf, nps:a.nps, netCashIncome:netCashIncome,
      rent:rent, milk:milk, fixedOthers:fixedOthers, emiTotal:emiTotal, activeEmis:activeEmis,
      recurringExpenses:recurringExpenses, scheduledBills:scheduledBills, billsDue:billsDue,
      totalOutflow:totalOutflow, cashRemaining:cashRemaining
    };
  }

  function clampToGlobal(y,m){
    if(ymCompare(y,m, FORECAST_START.y, FORECAST_START.m) < 0) return { y:FORECAST_START.y, m:FORECAST_START.m };
    if(ymCompare(y,m, FORECAST_END.y, FORECAST_END.m) > 0) return { y:FORECAST_END.y, m:FORECAST_END.m };
    return { y:y, m:m };
  }

  function forecastFYOptions(){
    var opts = [];
    for(var y = FORECAST_START.y; y <= FORECAST_END.y; y++){ opts.push(fyLabel(y)); }
    return opts;
  }

  function forecastRangeForFY(fy){
    var startYear = parseInt(fy.split("-")[0], 10);
    var s = clampToGlobal(startYear, 4);
    var e = clampToGlobal(startYear + 1, 3);
    return { start:s, end:e };
  }

  function currentForecastRange(){
    var fc = state.forecast;
    if(fc.rangeMode === "custom"){
      var sp = fc.customStart.split("-"); var ep = fc.customEnd.split("-");
      var s = clampToGlobal(parseInt(sp[0],10), parseInt(sp[1],10));
      var e = clampToGlobal(parseInt(ep[0],10), parseInt(ep[1],10));
      if(ymCompare(s.y,s.m,e.y,e.m) > 0) e = s;
      return { start:s, end:e };
    }
    return forecastRangeForFY(fc.selectedFY);
  }

  function generateForecastMonths(range, a){
    var out = []; var y = range.start.y, m = range.start.m;
    while(ymCompare(y,m, range.end.y, range.end.m) <= 0){
      out.push(computeForecastMonth(y,m,a));
      m++; if(m > 12){ m = 1; y++; }
    }
    return out;
  }

  function defaultState(){
    var domains = {};
    DOMAIN_DEFS.forEach(function(d){
      domains[d.key] = { status:null, current:"", target:"", gap:"", nextAction:"",
        subs:d.subs.map(function(s){ return {id:uid(), name:s.name, url:s.url}; }) };
    });
    return {
      domains: domains,
      reviews: [],
      profile: { photo:"", fullName:"", phone:"", email:"", city:"", linkedin:"", emergencyContact:"", bloodGroup:"", dob:"" },
      finance: { currentFY: computeCurrentFY(), targetSavingsRate: 20, fy: {} },
      forecast: { assumptions: defaultForecastAssumptions(), rangeMode: "fy", selectedFY: "2026-27", customStart: "2026-09", customEnd: "2027-03" }
    };
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var base = defaultState();
      Object.keys(base.domains).forEach(function(k){ if(parsed.domains && parsed.domains[k]) base.domains[k] = parsed.domains[k]; });
      base.reviews = Array.isArray(parsed.reviews) ? parsed.reviews : [];
      if(parsed.profile){ Object.keys(base.profile).forEach(function(k){ if(parsed.profile[k] !== undefined) base.profile[k] = parsed.profile[k]; }); }
      if(parsed.finance){
        base.finance.currentFY = parsed.finance.currentFY || base.finance.currentFY;
        base.finance.targetSavingsRate = (parsed.finance.targetSavingsRate !== undefined) ? parsed.finance.targetSavingsRate : base.finance.targetSavingsRate;
        base.finance.fy = parsed.finance.fy || {};
      }
      if(parsed.forecast){
        if(parsed.forecast.assumptions) mergeForecastAssumptions(base.forecast.assumptions, parsed.forecast.assumptions);
        if(parsed.forecast.rangeMode) base.forecast.rangeMode = parsed.forecast.rangeMode;
        if(parsed.forecast.selectedFY) base.forecast.selectedFY = parsed.forecast.selectedFY;
        if(parsed.forecast.customStart) base.forecast.customStart = parsed.forecast.customStart;
        if(parsed.forecast.customEnd) base.forecast.customEnd = parsed.forecast.customEnd;
      }
      return base;
    }catch(e){ console.error("load failed", e); return defaultState(); }
  }

  var state = loadState();
  var activeTab = "overview";
  var saveTimer = null;

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); flagSaved(); }
      catch(e){ console.error("save failed", e); }
    }, 400);

  function flagSaved(){
    var el = document.getElementById("savedFlag");

  function autosize(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }
  function domainDef(key){ return DOMAIN_DEFS.filter(function(d){ return d.key === key; })[0]; }

  function shadeText(hex){
    var c = hex.replace("#","");
    var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    var lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    return lum > 0.62 ? "#1B140A" : "#0A0A10";
  }

  function setAura(color){
    var aura = document.getElementById("aura");
    aura.classList.remove("on");
    setTimeout(function(){
      aura.style.background = "radial-gradient(circle, " + color + " 0%, transparent 70%)";
      aura.classList.add("on");

  /* ---------------- tabs ---------------- */

  function buildTabs(){
    var wrap = document.getElementById("tabs");
    wrap.innerHTML = "";
    NAV_ITEMS.forEach(function(item){
      var btn = document.createElement("button");
      btn.className = "tab-btn";
      btn.type = "button";
      btn.dataset.key = item.key;
      btn.textContent = item.label;
      btn.addEventListener("click", function(){ setActiveTab(item.key); });
      wrap.appendChild(btn);
    });
    updateTabStyles();
  }

  function accentForTab(key){
    if(key === "finance") return FINANCE_ACCENT;
    var def = domainDef(key);
    return def ? def.accent : GOLD;
  }

  function updateTabStyles(){
    var accent = accentForTab(activeTab);
    setAura(accent);
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      var isActive = btn.dataset.key === activeTab;
      btn.classList.toggle("active", isActive);
      if(isActive){ btn.style.background = accent; btn.style.color = shadeText(accent); }
      else{ btn.style.background = "transparent"; btn.style.color = ""; }
    });
  }

  function setActiveTab(key){
    if(activeTab === key) return;
    activeTab = key;
    updateTabStyles();
    renderMain();
  }

  /* ---------------- views ---------------- */

  function renderMain(){
    var main = document.getElementById("main");
    main.innerHTML = "";
    var view = document.createElement("div");
    view.className = "view";
    main.appendChild(view);
    if(activeTab === "overview") buildOverview(view);
    else if(activeTab === "review") buildReview(view);
    else if(activeTab === "profile") buildProfile(view);
    else if(activeTab === "finance") buildFinance(view);
    else buildDomain(view, activeTab);
  }

  function buildMonthEditForm(mo, monthObj, fy){
    var wrap = document.createElement("div");
    var monthsData = state.finance.fy[fy].months;
    var idx = MONTHS.indexOf(mo);

    var toolbar = document.createElement("div");
    toolbar.className = "fin-toolbar";

    var copyBtn = document.createElement("button");
    copyBtn.type = "button"; copyBtn.textContent = "Copy Previous Month";
    if(idx <= 0) copyBtn.disabled = true;
    copyBtn.addEventListener("click", function(){
      if(idx <= 0) return;
      var prevObj = monthsData[MONTHS[idx - 1]];
      INCOME_FIELDS.concat(DEDUCTION_FIELDS).concat(INVESTMENT_FIELDS).concat(EXPENSE_FIELDS).forEach(function(f){ monthObj[f[0]] = prevObj[f[0]] || 0; });
      monthObj.notes = prevObj.notes || "";
      scheduleSave();
      reRenderFinanceKeepOpen(mo);
    });
    toolbar.appendChild(copyBtn);

    var clearBtn = document.createElement("button");
    clearBtn.type = "button"; clearBtn.className = "fin-clear-btn"; clearBtn.textContent = "Clear Month";
    clearBtn.addEventListener("click", function(){
      if(!confirm("Clear all entries for " + mo + "? This can't be undone.")) return;
      INCOME_FIELDS.concat(DEDUCTION_FIELDS).concat(INVESTMENT_FIELDS).concat(EXPENSE_FIELDS).forEach(function(f){ monthObj[f[0]] = 0; });
      monthObj.notes = "";
      scheduleSave();
      reRenderFinanceKeepOpen(mo);
    });
    toolbar.appendChild(clearBtn);

    var closeBtn = document.createElement("button");
    closeBtn.type = "button"; closeBtn.className = "fin-close-btn"; closeBtn.textContent = "Close";
    closeBtn.addEventListener("click", function(){
      var b = document.getElementById("fin-editbtn-" + mo);
      if(b) b.click();
    });
    toolbar.appendChild(closeBtn);
    wrap.appendChild(toolbar);

    var groups = document.createElement("div");
    groups.className = "fin-groups";
    groups.appendChild(buildFieldGroup("Income", INCOME_FIELDS, monthObj, mo, fy));
    groups.appendChild(buildFieldGroup("Deductions", DEDUCTION_FIELDS, monthObj, mo, fy));
    groups.appendChild(buildFieldGroup("Investments from Income", INVESTMENT_FIELDS, monthObj, mo, fy));
    groups.appendChild(buildFieldGroup("Expenses", EXPENSE_FIELDS, monthObj, mo, fy));
    wrap.appendChild(groups);

    var notesWrap = document.createElement("div");
    notesWrap.className = "fin-notes";
    var lab = document.createElement("label");
    lab.textContent = "Notes";
    var ta = document.createElement("textarea");
    ta.value = monthObj.notes || "";
    ta.placeholder = "Anything worth remembering about this month\u2026";
    ta.addEventListener("input", function(){ monthObj.notes = ta.value; scheduleSave(); });
    notesWrap.appendChild(lab); notesWrap.appendChild(ta);
    wrap.appendChild(notesWrap);

    return wrap;
  }

  function buildFieldGroup(title, fields, monthObj, mo, fy){
    var group = document.createElement("div");
    group.className = "fin-group";
    var h = document.createElement("h4");
    h.textContent = title;
    group.appendChild(h);
    fields.forEach(function(f){
      var key = f[0], label = f[1];
      var row = document.createElement("div");
      row.className = "fg-row";
      var lab = document.createElement("label");
      lab.textContent = label;
      var inp = document.createElement("input");
      inp.type = "number"; inp.step = "1";
      inp.value = monthObj[key] || 0;
      inp.addEventListener("input", function(){
        monthObj[key] = parseFloat(inp.value) || 0;
        scheduleSave();
        updateMonthRow(mo, fy);
        updateSummary(fy);
        updateBadge(fy);
      });
      row.appendChild(lab); row.appendChild(inp);
      group.appendChild(row);
    });
    return group;
  }

  function updateMonthRow(mo, fy){
    var t = monthTotals(state.finance.fy[fy].months[mo]);
    setText("fin-cell-" + mo + "-gross", fmtINRz(t.gross));
    setText("fin-cell-" + mo + "-ded", fmtINRz(t.ded));
    setText("fin-cell-" + mo + "-inv", fmtINRz(t.inv));
    setText("fin-cell-" + mo + "-net", fmtINRz(t.net));
    setText("fin-cell-" + mo + "-exp", fmtINRz(t.exp));
    setText("fin-cell-" + mo + "-sav", fmtINRz(t.sav));
    setText("fin-cell-" + mo + "-rate", fmtPctz(t.rate));
  }
  function updateSummary(fy){
    var agg = fyAggregate(fy);
    setText("fin-sum-gross", fmtINRz(agg.gross));
    setText("fin-sum-ded", fmtINRz(agg.ded));
    setText("fin-sum-inv", fmtINRz(agg.inv));
    setText("fin-sum-net", fmtINRz(agg.net));
    setText("fin-sum-exp", fmtINRz(agg.exp));
    setText("fin-sum-sav", fmtINRz(agg.sav));
    setText("fin-sum-rate", fmtPctz(agg.rate));
    setText("fin-sum-wrate", fmtPctz(agg.wrate));
    renderBreakdown(fy);
    renderInsights(fy);
  }

  /* ---- yearly expense breakdown & insights ---- */

  function categoryTotals(fy){
    var months = state.finance.fy[fy].months;
    return EXPENSE_FIELDS.map(function(f){
      var total = MONTHS.reduce(function(s, mo){ return s + (parseFloat(months[mo][f[0]]) || 0); }, 0);
      return { key:f[0], label:f[1], total:total };
    });
  }

  function renderBreakdown(fy){
    var host = document.getElementById("finBreakdownBody");
    if(!host) return;
    var cats = categoryTotals(fy).sort(function(a,b){ return b.total - a.total; });
    var totalExp = cats.reduce(function(s,c){ return s + c.total; }, 0);
    host.innerHTML = "";
    cats.forEach(function(c){
      var pct = totalExp > 0 ? (c.total / totalExp * 100) : 0;
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + c.label + "</td>" +
        '<td class="fb-num">' + fmtINRz(c.total) + "</td>" +
        '<td class="fb-num">' + fmtPctz(pct) + "</td>";
      host.appendChild(tr);
    });
  }

  function computeInsights(fy){
    ensureFYData(fy);
    var months = state.finance.fy[fy].months;
    var totals = MONTHS.map(function(mo){ return { mo:mo, t:monthTotals(months[mo]) }; });
    var hasData = totals.some(function(x){ return x.t.gross > 0 || x.t.exp > 0; });
    if(!hasData) return null;

    var highestIncome = totals.reduce(function(a,b){ return b.t.gross > a.t.gross ? b : a; });
    var highestExpense = totals.reduce(function(a,b){ return b.t.exp > a.t.exp ? b : a; });
    var lowestSavings = totals.reduce(function(a,b){ return b.t.sav < a.t.sav ? b : a; });
    var bestRate = totals.reduce(function(a,b){ return b.t.rate > a.t.rate ? b : a; });
    var avgSavings = totals.reduce(function(s,x){ return s + x.t.sav; }, 0) / 12;
    var avgInvestments = totals.reduce(function(s,x){ return s + x.t.inv; }, 0) / 12;
    var totalWealthAllocation = totals.reduce(function(s,x){ return s + x.t.wealth; }, 0);
    var target = state.finance.targetSavingsRate;
    var belowTargetCount = totals.filter(function(x){ return x.t.gross > 0 && x.t.rate < target; }).length;

    var cats = categoryTotals(fy).sort(function(a,b){ return b.total - a.total; });
    var totalExp = cats.reduce(function(s,c){ return s + c.total; }, 0);
    var topCategory = cats[0] && cats[0].total > 0 ? { label: cats[0].label, total: cats[0].total, pct: totalExp > 0 ? (cats[0].total / totalExp * 100) : 0 } : null;

    return {
      highestIncome:highestIncome, highestExpense:highestExpense, lowestSavings:lowestSavings, bestRate:bestRate,
      avgSavings:avgSavings, avgInvestments:avgInvestments, totalWealthAllocation:totalWealthAllocation,
      belowTargetCount:belowTargetCount, topCategory:topCategory
    };
  }

  function renderInsights(fy){
    var host = document.getElementById("finInsightsGrid");
    if(!host) return;
    host.innerHTML = "";
    var ins = computeInsights(fy);
    if(!ins){
      host.innerHTML = '<p class="empty">Not enough data yet \u2014 fill in a few months above to see insights here.</p>';
      return;
    }
    var cards = [
      ["Highest income month", ins.highestIncome.mo + " \u2014 " + fmtINR(ins.highestIncome.t.gross)],
      ["Highest expense month", ins.highestExpense.mo + " \u2014 " + fmtINR(ins.highestExpense.t.exp)],
      ["Lowest cash savings month", ins.lowestSavings.mo + " \u2014 " + fmtINR(ins.lowestSavings.t.sav)],
      ["Best savings rate month", ins.bestRate.mo + " \u2014 " + fmtPct(ins.bestRate.t.rate)],
      ["Top expense category", ins.topCategory ? (ins.topCategory.label + " \u2014 " + fmtINR(ins.topCategory.total) + " (" + fmtPct(ins.topCategory.pct) + ")") : "\u2014"],
      ["Average monthly cash savings", fmtINR(ins.avgSavings)],
      ["Average monthly income investments", fmtINR(ins.avgInvestments)],
      ["Total wealth allocation", fmtINR(ins.totalWealthAllocation)],
      ["Months below target savings rate", ins.belowTargetCount + (ins.belowTargetCount === 1 ? " month" : " months")]
    ];
    cards.forEach(function(c){
      var card = document.createElement("div");
      card.className = "fin-insight-card";
      card.innerHTML = '<div class="fc-label">' + c[0] + '</div><div class="fc-value">' + c[1] + '</div>';
      host.appendChild(card);
    });
  }
  function updateBadge(fy){
    var badge = document.getElementById("finBadge");
    if(!badge) return;
    var agg = fyAggregate(fy);
    var target = state.finance.targetSavingsRate;
    var level, text;
    if(agg.gross === 0){ level = null; text = "No data yet"; }
    else if(agg.sav < 0){ level = "negative"; text = "Savings negative"; }
    else if(agg.rate < target){ level = "attention"; text = "Below target (" + fmtPct(agg.rate) + " vs " + target + "%)"; }
    else{ level = "steady"; text = "On track (" + fmtPct(agg.rate) + ")"; }
    badge.textContent = text;
    badge.style.color = level ? financeColor(level) : "";
    badge.style.borderColor = level ? financeColor(level) : "";
  }
  function setText(id, text){ var el = document.getElementById(id); if(el) el.textContent = text; }

  function buildDomain(view, key){
    var def = domainDef(key);
    var d = state.domains[key];

    var split = document.createElement("div");
    split.className = "focus-split";

    var left = document.createElement("div");
    left.className = "focus-left";
    left.innerHTML =
      '<div class="focus-eyebrow">' + def.name.toUpperCase() + ' &middot; ' + def.gem.toUpperCase() + '</div>' +
      '<div class="focus-title">' + def.subtitle + '</div>';

    FIELD_ORDER.forEach(function(pair){
      var fkey = pair[0], label = pair[1];
      var row = document.createElement("div");
      row.className = "frow" + (fkey === "nextAction" ? " next" : "");
      var lab = document.createElement("label");
      lab.textContent = label;
      lab.style.color = fkey === "nextAction" ? def.accent : "";
      var ta = document.createElement("textarea");
      ta.rows = 1;
      ta.placeholder = fkey === "nextAction" ? "The one action that moves this forward\u2026" : "\u2014";
      ta.value = d[fkey] || "";
      ta.addEventListener("input", function(){ d[fkey] = ta.value; autosize(ta); scheduleSave(); });
      row.appendChild(lab); row.appendChild(ta);
      left.appendChild(row);
      requestAnimationFrame(function(){ autosize(ta); });
    });
    split.appendChild(left);

    var right = document.createElement("div");
    right.className = "focus-right";

    var seg = document.createElement("div");
    seg.className = "seg";
    ["steady","attention","stalled"].forEach(function(s){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = s.charAt(0).toUpperCase() + s.slice(1);
      if(d.status === s){ b.classList.add("on"); b.style.background = def.accent; b.style.color = shadeText(def.accent); }
      b.addEventListener("click", function(){
        d.status = (d.status === s) ? null : s;
        scheduleSave();
        renderMain();
      });
      seg.appendChild(b);
    });
    right.appendChild(seg);

    var dialWrap = document.createElement("div");
    dialWrap.className = "dial-wrap";
    var level = d.status ? STATUS_LEVELS[d.status] : 0.22;
    var r = 100, circ = 2 * Math.PI * r;
    var offset = circ * (1 - level);
    dialWrap.innerHTML =
      '<svg width="230" height="230">' +
      '<circle cx="115" cy="115" r="' + r + '" fill="none" stroke="rgba(212,175,55,0.16)" stroke-width="12"></circle>' +
      '<circle cx="115" cy="115" r="' + r + '" fill="none" stroke="' + def.accent + '" stroke-width="12" stroke-linecap="round" ' +
      'stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + circ.toFixed(1) + '" transform="rotate(-90 115 115)">' +
      '<animate attributeName="stroke-dashoffset" from="' + circ.toFixed(1) + '" to="' + offset.toFixed(1) + '" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"></animate>' +
      '</circle></svg>' +
      '<div class="dial-center"><div class="dv">' + (d.status ? (d.status.charAt(0).toUpperCase() + d.status.slice(1)) : "Not set") + '</div><div class="dl">status</div></div>';
    right.appendChild(dialWrap);

    var subhead = document.createElement("div");
    subhead.className = "subhead";
    subhead.innerHTML = '<span>ACTIVE SUB-PROJECTS</span>';
    var addChip = document.createElement("button");
    addChip.className = "add-chip";
    addChip.textContent = "+ add";
    addChip.addEventListener("click", function(){ d.subs.push({id:uid(), name:"", url:""}); scheduleSave(); renderMain(); });
    subhead.appendChild(addChip);
    right.appendChild(subhead);

    var subList = document.createElement("div");
    subList.className = "sub-list";
    d.subs.forEach(function(sub, i){
      var row = buildSubRow(d, sub, def.accent);
      row.style.animationDelay = (i * 0.04) + "s";
      subList.appendChild(row);
    });
    right.appendChild(subList);

    split.appendChild(right);
    view.appendChild(split);
  }

  function buildSubRow(d, sub, accent){
    var row = document.createElement("div");
    row.className = "sub-row";
    var nameInput = document.createElement("input");
    nameInput.type = "text"; nameInput.className = "s-name"; nameInput.placeholder = "sub-project name";
    nameInput.value = sub.name || "";
    nameInput.addEventListener("input", function(){ sub.name = nameInput.value; scheduleSave(); });

    var urlInput = document.createElement("input");
    urlInput.type = "text"; urlInput.className = "s-url"; urlInput.placeholder = "link (optional)";
    urlInput.value = sub.url || "";
    urlInput.addEventListener("input", function(){ sub.url = urlInput.value; scheduleSave(); });

    var removeBtn = document.createElement("button");
    removeBtn.className = "s-remove"; removeBtn.type = "button"; removeBtn.textContent = "\u00d7";
    removeBtn.addEventListener("click", function(){ d.subs = d.subs.filter(function(s){ return s.id !== sub.id; }); scheduleSave(); renderMain(); });

    row.appendChild(nameInput); row.appendChild(urlInput);
    if(sub.url){
      var link = document.createElement("a");
      link.className = "s-link"; link.target = "_blank"; link.rel = "noopener noreferrer"; link.style.color = accent;
      link.href = /^https?:\/\//.test(sub.url) ? sub.url : ("https://" + sub.url);
      link.textContent = "\u2197";
      row.appendChild(link);
    }
    row.appendChild(removeBtn);
    return row;
  }

  function buildReview(view){
    view.innerHTML =
      '<h1 class="hero-title" style="font-size:32px;">Review log</h1>' +
      '<p class="hero-loop">Log what changed and what it means \u2014 weekly, monthly, quarterly.</p>';

    var composer = document.createElement("div");
    composer.className = "composer";
    var select = document.createElement("select");
    ["Weekly","Monthly","Quarterly","Note"].forEach(function(c){ var o = document.createElement("option"); o.textContent = c; select.appendChild(o); });
    var ta = document.createElement("textarea");
    ta.rows = 2; ta.placeholder = "What did you notice? What's changing? What should shift next?";
    ta.addEventListener("input", function(){ autosize(ta); });
    var logBtn = document.createElement("button");
    logBtn.className = "log-btn"; logBtn.textContent = "Log entry";
    logBtn.addEventListener("click", function(){
      var text = ta.value.trim();
      if(!text) return;
      state.reviews.push({ id:uid(), date:Date.now(), cadence:select.value, text:text });
      scheduleSave(); renderMain();
    });
    composer.appendChild(select); composer.appendChild(ta); composer.appendChild(logBtn);
    view.appendChild(composer);

    if(!state.reviews.length){
      var empty = document.createElement("p");
      empty.className = "empty"; empty.textContent = "No entries yet. Log your first review above.";
      view.appendChild(empty);
    }else{
      state.reviews.slice().reverse().forEach(function(r){
        var item = document.createElement("div");
        item.className = "r-item";
        var dt = new Date(r.date);
        item.innerHTML =
          '<div class="r-meta">' + dt.toLocaleDateString(undefined,{day:"numeric",month:"short"}) + '<br>' +
          dt.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}) +
          '<span class="tag">' + r.cadence + '</span></div>' +
          '<div class="r-text">' + escapeHtml(r.text) + '</div>';
        var del = document.createElement("button");
        del.className = "r-del"; del.textContent = "\u00d7";
        del.addEventListener("click", function(){
          state.reviews = state.reviews.filter(function(x){ return x.id !== r.id; });
          scheduleSave(); renderMain();
        });
        item.appendChild(del);
        view.appendChild(item);
      });
    }
  }

  /* ---------------- clock ---------------- */
  function tickClock(){
    var now = new Date();
    document.getElementById("clockLine").textContent =
      now.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit"}) + " \u00b7 " +
      now.toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"});
  }

  /* ---------------- controls ---------------- */
  document.getElementById("exportBtn").addEventListener("click", function(){
    try{
      var blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "aman-mlg-life-tracker-" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(e){ console.error("export failed", e); }
  });
  document.getElementById("importBtn").addEventListener("click", function(){ document.getElementById("importFile").click(); });
  document.getElementById("importFile").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        var base = defaultState();
        Object.keys(base.domains).forEach(function(k){ if(parsed.domains && parsed.domains[k]) base.domains[k] = parsed.domains[k]; });
        base.reviews = Array.isArray(parsed.reviews) ? parsed.reviews : [];
        if(parsed.profile){ Object.keys(base.profile).forEach(function(k){ if(parsed.profile[k] !== undefined) base.profile[k] = parsed.profile[k]; }); }
        if(parsed.finance){
          base.finance.currentFY = parsed.finance.currentFY || base.finance.currentFY;
          base.finance.targetSavingsRate = (parsed.finance.targetSavingsRate !== undefined) ? parsed.finance.targetSavingsRate : base.finance.targetSavingsRate;
          base.finance.fy = parsed.finance.fy || {};
        }
        if(parsed.forecast){
          if(parsed.forecast.assumptions) mergeForecastAssumptions(base.forecast.assumptions, parsed.forecast.assumptions);
          if(parsed.forecast.rangeMode) base.forecast.rangeMode = parsed.forecast.rangeMode;
          if(parsed.forecast.selectedFY) base.forecast.selectedFY = parsed.forecast.selectedFY;
          if(parsed.forecast.customStart) base.forecast.customStart = parsed.forecast.customStart;
          if(parsed.forecast.customEnd) base.forecast.customEnd = parsed.forecast.customEnd;
        }
        state = base;
        scheduleSave(); renderMain();
      }catch(err){ alert("Could not read that file \u2014 is it a life tracker export?"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });
  document.getElementById("resetBtn").addEventListener("click", function(){
    if(!confirm("Reset all data on this device? This can't be undone unless you've exported a backup.")) return;
    state = defaultState();
    scheduleSave(); renderMain();
  });

  buildTabs();
  renderMain();
  tickClock();
  setInterval(tickClock, 1000);
})();
</script>
</body>
</html>
